name: Android listener APK (test)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-listener/**'
      - '.github/workflows/android-listener.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate launcher icons from PS MUSIC STREAM website logo
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import re, base64, io
          svg=Path('ps-icon.svg').read_text()
          encoded=re.search(r'href="data:image/jpeg;base64,([^"]+)"',svg)
          if not encoded:
              raise SystemExit('PS website icon not found')
          original=Image.open(io.BytesIO(base64.b64decode(encoded.group(1)))).convert('RGBA')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          res=Path('android-listener/app/src/main/res')
          for density,size in sizes.items():
              folder=res/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              icon=original.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png')
              mask=Image.new('L',(size,size),0)
              ImageDraw.Draw(mask).ellipse((0,0,size-1,size-1),fill=255)
              rounded=icon.copy()
              rounded.putalpha(mask)
              rounded.save(folder/'ic_launcher_round.png')
          print('PS MUSIC STREAM icons generated from ps-icon.svg')
          PY
      - name: Build debug APK
        working-directory: android-listener
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps-music-stream-listener-debug-apk
          path: android-listener/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
