<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PS MUSIC STREAM – Künstlerstudio</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div class="brand">PS <span>MUSIC STREAM</span> · Künstlerstudio</div><a class="btn secondary" href="index.html">Zur Musik</a></header><h1>Dein Künstlerprofil</h1><p>Registriere dich per E-Mail-Code und verwalte deine eigenen Suno-Veröffentlichungen.</p><section class="panel" id="login"><h2>Registrieren oder anmelden</h2><label>E-Mail-Adresse</label><input type="email" id="email" autocomplete="email" placeholder="deine@email.de"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="Mindestens 12 Zeichen"><div class="actions"><button id="register" class="btn">Künstlerkonto erstellen</button><button id="passwordlogin" class="btn secondary">Mit Passwort anmelden</button></div><p>Alternativ per E-Mail-Code:</p><div class="actions"><button id="send" class="btn secondary">Code anfordern</button></div><label>E-Mail-Code</label><input id="otpcode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6-stelliger Code"><div class="actions"><button id="verify" class="btn secondary">Mit Code anmelden</button></div></section><section class="panel hidden" id="studio"><h2>Mein Künstlerprofil</h2><label>Künstlername</label><input id="artistname" maxlength="90" placeholder="Dein Künstlername"><label>Über mich</label><textarea id="bio" rows="4" maxlength="2000"></textarea><div class="actions"><button id="saveprofile" class="btn">Profil speichern</button><button id="logout" class="btn secondary">Abmelden</button></div><h2>Meine Suno-Songs</h2><label>Songtitel</label><input id="title" maxlength="150"><label>Suno Songlink</label><input id="url" placeholder="https://suno.com/song/..."><div class="actions"><button id="addsong" class="btn">Song veröffentlichen</button></div><div id="mytracks" class="list"></div></section><p id="status" role="status" class="status"></p></main><script src="cloud.js"></script><script src="artist.js"></script></body></html>
