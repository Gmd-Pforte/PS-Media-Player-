name: Android listener APK (test)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-listener/**'
      - '.github/workflows/android-listener.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-listener
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps-music-stream-listener-debug-apk
          path: android-listener/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
