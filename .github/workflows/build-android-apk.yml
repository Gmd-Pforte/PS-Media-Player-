name: Build PS MUSIC STREAM Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'admin.html'
      - 'app.js'
      - 'admin.js'
      - 'style.css'
      - '.github/workflows/build-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy webapp to Android assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html admin.html app.js admin.js style.css android-app/app/src/main/assets/
      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PS-MUSIC-STREAM-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
