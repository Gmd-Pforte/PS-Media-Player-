<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<title>Künstler · PS MUSIC STREAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ps-live.css?v=2">
<link rel="icon" href="ps-icon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="ps-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body class="psl psl-profile">
<div id="psl-ambient" aria-hidden="true"></div>
<main class="wrap">
  <header class="top">
    <div class="psl-logo"><div class="psl-logo-mark">PS</div><div class="psl-logo-text">Music Stream<small>MUSIK AUS ECHTEN GEFÜHLEN</small></div></div>
    <a class="btn secondary small psl-back-link" href="index.html">← Musik entdecken</a>
  </header>

  <section id="profile" class="profile-shell">
    <div class="profile-banner" id="banner">
      <div class="psl-aura" aria-hidden="true"><i></i><i></i><i></i></div>
      <canvas id="psl-particles" aria-hidden="true"></canvas>
    </div>
    <div class="profile-header">
      <div class="artist-photo" id="photo">♫</div>
      <div class="psl-profile-text">
        <span class="eyebrow">KÜNSTLERPROFIL</span>
        <h1 id="artistname">Künstler laden …</h1>
        <p id="bio"></p>
        <button type="button" class="btn" id="psl-play-all"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Alle abspielen</button>
      </div>
    </div>
  </section>

  <div class="ps-section-heading psl-block"><div><div class="ps-section-kicker">MUSIK</div><h2>Veröffentlichungen</h2></div></div>
  <div id="tracks" class="list"></div>
  <p id="status" class="status"></p>
  <div class="ps-legal-links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></div>
</main>

<aside id="player" class="player psl-profile-player" hidden>
  <div class="phead">
    <div class="psl-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="info"><strong id="ptitle"></strong><small id="partist"></small></div>
    <button class="btn secondary small" id="close" aria-label="Player schließen">Schließen ✕</button>
  </div>
  <div class="profile-player-ui">
    <div class="ps-progress"><span id="profile-time">0:00</span><input id="profile-seek" type="range" min="0" max="100" value="0" aria-label="Wiedergabeposition"><span id="profile-duration">0:00</span></div>
    <div class="ps-controls">
      <button id="profile-prev" aria-label="Vorheriger Song">⏮</button>
      <button id="profile-play" aria-label="Abspielen oder Pause">▶</button>
      <button id="profile-next" aria-label="Nächster Song">⏭</button>
    </div>
    <p id="profile-status" class="notice">Nächster Song startet automatisch.</p>
  </div>
  <audio id="profile-audio" preload="metadata" controlslist="nodownload noplaybackrate" hidden></audio>
</aside>

<script src="cloud.js"></script>
<script src="profile.js?v=private-profile-1"></script>
<script>
document.getElementById('psl-play-all').onclick=()=>{if(typeof playProfile==='function')playProfile(0)};
if(/vorschau\.html$/.test(location.pathname))document.querySelector('.psl-back-link').href='vorschau.html';
</script>
<script defer src="ps-live.js?v=2"></script>
</body>
</html>
